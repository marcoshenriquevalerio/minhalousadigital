<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar | Lousa Digital</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--q:#0c1f17;--g:#f2efe4;--v:#9be3c0;--a:#f7d56b;--r:#f4a6c0;--b:#8ec9f5;--m:#a3b8ac}
body{background:var(--q);color:var(--g);font:17px/1.6 'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.gl{position:fixed;z-index:-2;width:62vmax;height:62vmax;border-radius:50%;filter:blur(100px);opacity:.3;background:hsl(150 70% 40%);left:-14vmax;top:-14vmax;animation:fl 20s ease-in-out infinite alternate}
.gl.b{left:auto;top:auto;right:-16vmax;bottom:-16vmax;background:hsl(220 70% 45%);animation-duration:27s}
@keyframes fl{to{translate:14vmax 9vmax;scale:1.25}}
a{color:inherit}
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:#0c1f17aa;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff14}
.logo{font:600 30px Caveat,cursive;color:var(--v);text-decoration:none}
.btn{display:inline-block;padding:12px 24px;border-radius:99px;font-weight:700;text-decoration:none;color:#0c1f17;background:var(--v);box-shadow:0 0 34px #9be3c055;transition:.3s}
.btn.o{background:none;color:var(--g);border:1px solid #ffffff44;box-shadow:none}.btn:hover{transform:scale(1.04)}
main{flex:1;display:grid;place-items:center;padding:50px 5vw}
.cd{width:min(440px,100%);padding:40px 34px 34px;border-radius:30px;text-align:center;background:linear-gradient(160deg,#143426,#0b1912);border:1px solid #9be3c044;box-shadow:0 40px 100px #000b,inset 0 0 90px #9be3c014;animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes up{from{opacity:0;translate:0 30px}}
.ch{font:600 30px Caveat,cursive;color:var(--a)}
h1{font-size:clamp(34px,6vw,46px);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:4px 0 0}
.ul{display:block;width:70%;height:22px;margin:4px auto 18px;overflow:visible}
.ul path{fill:none;stroke:var(--a);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s .4s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
p.s{color:var(--m);margin-bottom:26px}
.gb{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 20px;border:0;border-radius:99px;background:#fff;color:#1f1f1f;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 10px 30px #0006;transition:.3s}
.gb:hover{transform:translateY(-2px);box-shadow:0 16px 40px #0008}.gb svg{width:22px;height:22px;flex:none}
.msg{min-height:24px;margin-top:14px;color:var(--a);font-size:14px}
.hint{margin-top:10px;color:var(--m);font-size:14px}.hint a{color:var(--v)}
.back{display:inline-block;margin-top:22px;color:var(--m);text-decoration:none;font-size:15px}.back:hover{color:var(--g)}
.w{text-align:center;width:100%}.cd{margin-inline:auto}
footer{text-align:center;color:var(--m);font-size:14px;padding:30px 5vw;border-top:1px solid #ffffff14}
a:focus-visible,button:focus-visible{outline:3px solid var(--a);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="gl"></div><div class="gl b"></div>
<header class="nav"><a class="logo" href="index.html">Lousa Digital</a><a class="btn o" href="index.html">Voltar ao site</a></header>
<main><div class="w">
 <div class="cd">
  <span class="ch">bem-vindo de volta</span>
  <h1>Entrar na lousa</h1>
  <svg class="ul" viewBox="0 0 300 22" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M4 14C70 3 140 20 210 10S280 8 296 11"/></svg>
  <p class="s">Use sua conta Google para abrir suas lousas, o calendário e o planner.</p>
  <button class="gb" id="gl" type="button">
   <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
   Continuar com Google</button>
  <p class="msg" id="msg" role="status"></p>
  <p class="hint">Ainda não tem conta? <a href="index.html#planos">Conheça os planos</a></p>
 </div>
 <a class="back" href="index.html">&larr; Voltar ao site</a>
</div></main>
<footer>&copy; <span id="yr">2026</span> Lousa Digital. Todos os direitos reservados.</footer>
<script>
document.getElementById('yr').textContent=new Date().getFullYear();
/* LOGIN GOOGLE: por enquanto só a tela. Quando for ligar ao sistema, troque o conteúdo do clique
   pelo signInWithPopup do seu firebase.js e, no sucesso, redirecione para a lousa. */
document.getElementById('gl').onclick=()=>{document.getElementById('msg').textContent='Em breve: o login com Google será ligado à sua lousa.'};
const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,P=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(100,W/12|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.9+.4,v:Math.random()*.35+.08,a:Math.random()*.45+.12,p:Math.random()*6}))}
rs();addEventListener('resize',rs);
function dw(){x.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.v;p.p+=.01;if(p.y<-5)p.y=H+5;x.beginPath();x.arc(p.x+Math.sin(p.p)*14,p.y,p.r,0,6.3);x.fillStyle='rgba(242,239,228,'+p.a+')';x.fill()});if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(dw)}
dw();
</script>
<script src="giz.js" defer></script>
</body>
</html>
